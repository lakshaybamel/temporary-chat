<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temporary Chat</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Temporary Chat</h1>

        <p class="subtitle">
            Create a temporary room and chat anonymously.
        </p>

        <!-- Create Room -->

        <section class="section">

            <h2>Create a Room</h2>

            <input
                    type="text"
                    id="roomName"
                    placeholder="Enter room name"
                    maxlength="100"
            >

            <button id="createRoomBtn">
                Create Room
            </button>

        </section>


        <div class="divider">
            <span>OR</span>
        </div>


        <!-- Join Room -->

        <section class="section">

            <h2>Join a Room</h2>

            <input
                    type="text"
                    id="joinCode"
                    placeholder="Enter room code"
                    maxlength="6"
            >

            <button id="joinRoomBtn">
                Join Room
            </button>

        </section>


        <!-- Error / Success Message -->

        <div id="message" class="message"></div>

    </div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
